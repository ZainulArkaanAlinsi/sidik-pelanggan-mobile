<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Sertifikat</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
button,input{font:inherit;color:inherit}
a{color:#0B1F4B}a:hover{color:#1C3A7A}
@keyframes naik{from{opacity:0;translate:0 12px}to{opacity:1;translate:0 0}}
@keyframes tumbuh{from{scale:1 0}to{scale:1 1}}
@keyframes muncul{from{opacity:0;scale:.92}to{opacity:1;scale:1}}
a,button{transition:scale 120ms cubic-bezier(.33,1,.68,1)}a:active,button:active{scale:.97}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; background: #EEF0F3; color: #0B1F4B; font-family: 'Inter', system-ui, sans-serif; overflow: hidden">

  <header style="display: flex; align-items: center; height: 48px">
    <h1 style="margin: 0; font-size: 30px; line-height: 34px; font-weight: 800; letter-spacing: -0.03em">Sertifikat</h1>
  </header>

  <div role="group" aria-label="Tampilan" style="margin-top: 14px; height: 56px; box-sizing: border-box; padding: 6px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; border-radius: 28px; background: #FFFFFF; animation: naik 240ms cubic-bezier(0.33,1,0.68,1) 0ms both">
    <button type="button" aria-pressed="true" style="display: flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 22px; background: #0B1F4B; color: #FFFFFF; font-size: 14px; font-weight: 700; cursor: pointer">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h9"/></svg>
      Daftar
    </button>
    <button type="button" aria-pressed="false" style="display: flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 22px; background: none; font-size: 14px; font-weight: 700; cursor: pointer">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 7h6l2 2.5h9V19h-17z"/></svg>
      Arsip
    </button>
  </div>

  <div style="margin-top: 12px; height: 56px; box-sizing: border-box; padding: 0 6px 0 20px; display: flex; align-items: center; gap: 10px; border-radius: 28px; background: #FFFFFF; animation: naik 240ms cubic-bezier(0.33,1,0.68,1) 35ms both">
    <label for="cari-sertifikat" style="position: absolute; width: 1px; height: 1px; overflow: hidden">Cari sertifikat</label>
    <input id="cari-sertifikat" type="search" placeholder="Cari nomor sertifikat atau alat" style="flex-grow: 1; min-width: 0; height: 44px; border: 0; outline: 0; background: none; font-size: 14px">
    <button type="button" aria-label="Cari" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #0B1F4B; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></svg>
    </button>
  </div>

  <button type="button" role="switch" aria-checked="{{revisiAria}}" onClick="{{toggleRevisi}}" style="margin-top: 12px; min-height: 56px; box-sizing: border-box; padding: 8px 10px 8px 20px; display: flex; align-items: center; gap: 12px; border: 0; border-radius: 28px; background: #FFFFFF; text-align: left; cursor: pointer; animation: naik 240ms cubic-bezier(0.33,1,0.68,1) 70ms both">
    <span style="flex-grow: 1; font-size: 14px; font-weight: 600">Tampilkan juga yang sudah direvisi</span>
    <span aria-hidden="true" style="width: 56px; height: 36px; box-sizing: border-box; padding: 4px; border-radius: 18px; background: {{trackBg}}; display: flex; justify-content: {{knobSide}}; flex-shrink: 0">
      <span style="width: 28px; height: 28px; border-radius: 14px; background: {{knobBg}}"></span>
    </span>
  </button>

  <section style="margin-top: 16px; position: relative; height: 420px; box-sizing: border-box; padding: 22px; border-radius: 32px; background: #F6D36B; display: flex; flex-direction: column; overflow: hidden; animation: naik 240ms cubic-bezier(0.33,1,0.68,1) 105ms both">
    <h2 style="margin: 0; font-size: 26px; line-height: 30px; font-weight: 800; letter-spacing: -0.03em; max-width: 220px">Belum ada sertifikat</h2>
    <p style="margin: 8px 0 0; font-size: 14px; line-height: 20px; font-weight: 500; max-width: 230px">Sertifikat muncul di sini begitu diterbitkan dan disahkan laboratorium.</p>
    <img src="/_blob/05764b0325efb84106a3c5c1472def80" alt="" width="280" height="280" style="position: absolute; right: -34px; bottom: -40px; transform: rotate(-8deg); width: 280px; height: 280px; animation: muncul 240ms cubic-bezier(0.33,1,0.68,1) 240ms both">
    
  </section>

  <nav aria-label="Navigasi utama" style="margin-top: auto; align-self: center; display: flex; align-items: center; gap: 4px; padding: 8px; background: #0B1F4B; border-radius: 36px; box-shadow: 0 16px 32px rgba(11,31,75,0.28)">
    <a href="Main.dc.html" aria-label="Beranda" style="display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 24px; color: #FFFFFF">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5V20h-5v-5H9v5H4z"/></svg>
    </a>
    <a href="Alat.dc.html" aria-label="Alat" style="display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 24px; color: #FFFFFF">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16a8 8 0 1 1 16 0"/><path d="m12 16 4-5"/><path d="M4 20h16"/></svg>
    </a>
    <a href="Sertifikat.dc.html" aria-current="page" style="display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 16px; border-radius: 24px; background: #F6D36B; color: #0B1F4B; font-size: 14px; font-weight: 800; text-decoration: none">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/><path d="M9 12h7M9 16h5"/></svg>
      Sertifikat
    </a>
    <button type="button" aria-label="Notifikasi" style="display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 24px; background: none; border: 0; color: #FFFFFF; cursor: pointer">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 17v-6a6 6 0 1 1 12 0v6l1.5 2h-15z"/><path d="M10 21h4"/></svg>
    </button>
    <a href="Akun.dc.html" aria-label="Akun" style="display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 24px; color: #FFFFFF">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { revisi: false };
  renderVals() {
    const on = this.state.revisi;
    return {
      revisiAria: on ? 'true' : 'false',
      trackBg: on ? '#0B1F4B' : '#EEF0F3',
      knobBg: on ? '#F6D36B' : '#4A5672',
      knobSide: on ? 'flex-end' : 'flex-start',
      toggleRevisi: () => this.setState({ revisi: !on }),
    };
  }
}
</script>
</body>
</html>

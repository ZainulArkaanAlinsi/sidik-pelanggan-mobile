# Pemeriksaan tiap push & pull request: analyze + test, dan build Android debug.
#
# Job `android` ada karena `flutter test` TIDAK pernah menyentuh Gradle:
# plugin native baru (mis. `pdfx` untuk pratinjau PDF) yang gagal dikompilasi
# baru ketahuan waktu rilis. Dipasang meniru job `android` di
# `sidik-calibration-mobile/.github/workflows/periksa-pr.yml`. Runner CI adalah
# checkout bersih tanpa `google-services.json`, `android/key.properties`, dan
# keystore (semuanya memang tidak di-commit): build debug harus tetap jadi
# tanpa berkas itu. Tidak ada secret yang dipakai.
#
# Versi Flutter DIPATOK sama dengan `sidik-calibration-mobile` (periksa-pr.yml):
# dua aplikasi satu tim, satu set versi. Analyzer sering berganti perilaku antar
# rilis, dan CI yang beda versi dari laptop bikin "hijau di CI, merah di laptop".
name: Periksa

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: periksa-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.6

jobs:
  periksa:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test

  android:
    name: Build Android (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Debug, bukan release: release butuh `android/key.properties` + keystore
      # (rahasia pemilik, tidak ada di CI), dan build debug sudah cukup
      # membuktikan Gradle + semua plugin native terkompilasi. Tanpa
      # `google-services.json` push/Crashlytics mati tapi build jalan terus
      # (lihat `android/app/build.gradle.kts`). Kalau langkah ini gagal dengan
      # "File google-services.json is missing", yang dibetulkan penjaganya di
      # sana, BUKAN dengan menaruh berkasnya di CI.
      - name: flutter build apk --debug
        run: flutter build apk --debug
